<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New App</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      #app { text-align: center; padding: 2rem; }
      h1 { margin-bottom: 1rem; }
      #status { padding: 0.5rem 1rem; border-radius: 4px; background: #16213e; margin: 1rem 0; }
      #messages { max-height: 300px; overflow-y: auto; background: #0f0f23; padding: 1rem; border-radius: 8px; margin: 1rem 0; min-width: 300px; text-align: left; }
      .msg { padding: 0.25rem 0; border-bottom: 1px solid #333; }
      input { padding: 0.5rem; border: none; border-radius: 4px; margin-right: 0.5rem; }
      button { padding: 0.5rem 1rem; border: none; border-radius: 4px; background: #e94560; color: white; cursor: pointer; }
      button:hover { background: #ff6b6b; }
    </style>
  </head>
  <body>
    <div id="app">
      <h1>New App</h1>
      <div id="status">Connecting...</div>
      <div id="messages"></div>
      <div>
        <input type="text" id="input" placeholder="Type a message..." />
        <button id="send">Send</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
